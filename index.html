<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单据匹配工具 v2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg: #ffffff;
  --surface: #f5f6f8;
  --surface2: #eceef2;
  --border: #d4d8e2;
  --accent: #00926b;
  --accent-dim: rgba(0,146,107,0.10);
  --blue: #1d6fc4;
  --blue-dim: rgba(29,111,196,0.10);
  --warn: #d95a1a;
  --warn-dim: rgba(217,90,26,0.08);
  --red: #c42b2b;
  --red-dim: rgba(196,43,43,0.08);
  --text: #1a1d24;
  --muted: #8a90a0;
  --mono: 'IBM Plex Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 20px 14px 80px;
}

.wrap { max-width: 1100px; margin: 0 auto; }

/* Header */
.header {
  margin-bottom: 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--border);
}

.header-left { flex: 1; min-width: 200px; }

h1 {
  font-family: var(--mono);
  font-size: clamp(18px, 3vw, 26px);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
}
h1 em { font-style: normal; color: var(--accent); }

.desc {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
  font-family: var(--mono);
}

/* Quick bar */
.quick-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding-top: 4px;
}

.qbtn {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  padding: 9px 18px;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  transition: all 0.15s;
  white-space: nowrap;
}
.qbtn-paste { border-color: var(--blue); color: var(--blue); }
.qbtn-paste:hover { background: var(--blue-dim); }
.qbtn-add { border-color: var(--accent); color: var(--accent); }
.qbtn-add:hover { background: var(--accent-dim); }
.qbtn-clear { border-color: var(--red); color: var(--red); }
.qbtn-clear:hover { background: var(--red-dim); }

.paste-preview {
  display: none;
  background: var(--surface);
  border: 1px solid var(--blue);
  padding: 8px 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  max-height: 60px;
  overflow-y: auto;
  max-width: 340px;
  white-space: pre-wrap;
  word-break: break-all;
  line-height: 1.5;
  margin-top: 6px;
}
.paste-preview.show { display: block; }

/* A panel */
.panel-a {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-top: 3px solid var(--accent);
  padding: 16px;
  margin-bottom: 12px;
}

.panel-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.panel-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--accent);
}

.cust-loaded-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  margin-left: auto;
}

/* Customer dropdown */
.cust-drop-wrap { position: relative; display: inline-block; }
.cust-drop-panel {
  display: none; position: absolute; top: calc(100% + 4px); left: 0;
  background: var(--bg); border: 1.5px solid var(--accent);
  z-index: 50; min-width: 220px; max-height: 260px;
  overflow-y: auto; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
}
.cust-drop-panel.show { display: block; }
.drop-search-row { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.drop-search-row input {
  width: 100%; background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 11px;
  padding: 5px 8px; outline: none;
}
.drop-search-row input:focus { border-color: var(--accent); }
.drop-search-row input::placeholder { color: var(--muted); }
.drop-item {
  padding: 9px 12px; font-family: var(--mono); font-size: 12px;
  color: var(--text); cursor: pointer; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border); transition: background 0.1s;
}
.drop-item:hover { background: var(--accent-dim); color: var(--accent); }
.drop-item .di-count { font-size: 10px; color: var(--muted); }
.drop-empty {
  padding: 12px; font-family: var(--mono); font-size: 11px;
  color: var(--muted); font-style: italic;
}

textarea.main-ta {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  line-height: 1.65; padding: 12px; resize: vertical; outline: none;
  min-height: 180px; transition: border-color 0.2s;
}
textarea.main-ta::placeholder { color: var(--muted); }
textarea.main-ta:focus { border-color: var(--accent); }

.counter {
  margin-top: 6px; font-family: var(--mono); font-size: 11px;
  color: var(--muted); text-align: right;
}
.counter em { color: var(--accent); font-style: normal; }

/* Action bar */
.action-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-bottom: 20px;
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 11px 24px; font-family: var(--mono); font-size: 13px;
  font-weight: 600; letter-spacing: 0.06em;
  cursor: pointer; border: none; transition: opacity 0.15s;
  white-space: nowrap;
}
.btn:active { opacity: 0.8; }
.btn-match { background: var(--accent); color: #fff; }
.btn-match:hover { opacity: 0.88; }
.btn-export { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
.btn-export:hover { background: var(--blue-dim); }
.btn-export:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-sm {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); font-size: 11px; padding: 11px 14px;
}
.btn-sm:hover { color: var(--red); border-color: var(--red); }

.stat-row {
  margin-left: auto; display: flex; gap: 14px;
  font-family: var(--mono); font-size: 11px; color: var(--muted);
}
.stat-row span em { font-style: normal; font-weight: 600; }
.stat-row .s-match em { color: var(--accent); }

/* Collapsible sections */
.collapse-section {
  border: 1px solid var(--border);
  margin-bottom: 12px;
  background: var(--surface);
}

.collapse-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid transparent;
  transition: background 0.15s;
}
.collapse-header:hover { background: var(--surface2); }
.collapse-header.open { border-bottom-color: var(--border); }

.collapse-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  flex: 1;
}
.collapse-title-a { color: var(--accent); }
.collapse-title-b { color: var(--blue); }

.collapse-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}
.collapse-meta em { font-style: normal; font-weight: 600; }
.collapse-meta-a em { color: var(--accent); }
.collapse-meta-b em { color: var(--blue); }

.collapse-arrow {
  font-size: 10px; color: var(--muted);
  transition: transform 0.2s;
  display: inline-block;
}
.collapse-header.open .collapse-arrow { transform: rotate(90deg); }

.collapse-body { padding: 16px; display: none; }
.collapse-body.open { display: block; }

/* Tag lists */
.tag-list {
  display: flex; flex-wrap: wrap; gap: 8px;
  margin-bottom: 14px; min-height: 30px; align-items: center;
}

.cust-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg); border: 1px solid var(--border);
  padding: 5px 8px 5px 10px; font-family: var(--mono); font-size: 11px;
  color: var(--text);
}
.cust-tag .tag-count { color: var(--accent); font-size: 10px; }
.tag-btn {
  background: none; border: none; cursor: pointer; font-size: 10px;
  padding: 2px 6px; line-height: 1; font-family: var(--mono);
  transition: color 0.15s; border-left: 1px solid var(--border);
  margin-left: 2px; color: var(--muted);
}
.tag-btn:hover { color: var(--accent); }
.tag-del:hover { color: var(--red) !important; }

.month-tag {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg); border: 1px solid var(--border);
  padding: 5px 10px; font-family: var(--mono); font-size: 11px; color: var(--text);
}
.month-tag em { font-style: normal; color: var(--blue); font-size: 10px; }
.month-tag .del-month {
  background: none; border: none; color: var(--muted);
  cursor: pointer; font-size: 14px; padding: 0 0 0 4px;
  line-height: 1; transition: color 0.15s;
}
.month-tag .del-month:hover { color: var(--red); }

.no-data { font-family: var(--mono); font-size: 12px; color: var(--muted); font-style: italic; }

/* New customer row */
.new-cust-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.new-cust-row input[type=text] {
  background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 7px 12px; outline: none; flex: 1; min-width: 160px;
  transition: border-color 0.2s;
}
.new-cust-row input[type=text]:focus { border-color: var(--accent); }
.new-cust-row input[type=text]::placeholder { color: var(--muted); }

/* Small buttons */
.hbtn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 5px 12px; cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  white-space: nowrap; display: inline-flex; align-items: center;
}
.hbtn:hover { color: var(--red); border-color: var(--red); }
.hbtn.blue { color: var(--blue); border-color: var(--blue); }
.hbtn.blue:hover { background: var(--blue-dim); }
.hbtn.green { color: var(--accent); border-color: var(--accent); }
.hbtn.green:hover { background: var(--accent-dim); }

input[type=file] { display: none; }

/* B Add area */
.add-b-row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.add-b-row textarea {
  flex: 1; min-width: 200px;
  background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  line-height: 1.6; padding: 10px 12px; outline: none;
  resize: vertical; min-height: 100px; transition: border-color 0.2s;
}
.add-b-row textarea:focus { border-color: var(--blue); }
.add-b-row textarea::placeholder { color: var(--muted); }
.add-b-btns { display: flex; flex-direction: column; gap: 6px; }

/* Date check panel */
#dateCheckPanel {
  background: var(--bg); border: 1px solid var(--border);
  padding: 14px 16px; margin-bottom: 14px;
}

/* B preview */
#dbPreview { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.8; margin-bottom: 12px; }

/* Results */
.results-wrap { display: none; }
.results-wrap.show { display: block; }

.section-title {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.table-scroll {
  overflow-x: auto; background: var(--bg);
  border: 1px solid var(--border); margin-bottom: 20px;
}

table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; min-width: 540px; }
thead tr { background: var(--surface2); border-bottom: 1px solid var(--border); }
th {
  padding: 10px 14px; text-align: left; font-size: 10px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; white-space: nowrap;
}
tbody tr { border-bottom: 1px solid var(--surface2); transition: background 0.1s; }
tbody tr:hover { background: var(--surface); }
td { padding: 8px 14px; vertical-align: middle; color: var(--text); white-space: nowrap; }
.td-docno { font-weight: 600; color: var(--accent); }
.td-date { color: var(--muted); }
.td-amt { text-align: right; color: var(--blue); font-weight: 600; }

/* Toast */
.toast {
  position: fixed; bottom: 22px; right: 16px;
  background: var(--text);
  padding: 10px 18px; font-family: var(--mono); font-size: 12px;
  color: #fff; z-index: 999; opacity: 0;
  transform: translateY(8px); transition: all 0.25s;
  pointer-events: none; max-width: 280px; line-height: 1.5;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.warn { background: var(--warn); }
.toast.err { background: var(--red); }

/* Overlays */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 100;
  align-items: center; justify-content: center; padding: 16px;
}
.overlay.show { display: flex; }

/* Confirm dialog */
.dialog {
  background: var(--bg); border: 1.5px solid var(--border);
  padding: 24px; max-width: 360px; width: 90%;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}
.dialog-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--red); margin-bottom: 10px; }
.dialog-msg { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 20px; line-height: 1.7; white-space: pre-line; }
.dialog-btns { display: flex; gap: 10px; justify-content: flex-end; }
.dialog-btns button {
  font-family: var(--mono); font-size: 11px; padding: 8px 16px;
  cursor: pointer; border: 1px solid var(--border); background: var(--bg);
  color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; transition: all 0.15s;
}
.dialog-btns .confirm-del { color: var(--red); border-color: var(--red); }
.dialog-btns button:hover { opacity: 0.75; }

/* Manage modal */
.manage-modal {
  background: var(--bg); border: 1.5px solid var(--accent);
  width: 94%; max-width: 680px;
  max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}
.manage-header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  background: var(--surface);
}
.manage-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); flex: 1; }
.manage-body { flex: 1; overflow-y: auto; padding: 16px 18px; }

.manage-raw-ta {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 11px;
  padding: 10px 12px; resize: vertical; min-height: 200px; outline: none;
  transition: border-color 0.2s; line-height: 1.65;
}
.manage-raw-ta:focus { border-color: var(--accent); }
.manage-raw-ta::placeholder { color: var(--muted); }

.manage-section-label {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
  margin-bottom: 6px; display: block;
}

.manage-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.manage-append-ta {
  width: 100%; background: var(--surface); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 11px;
  padding: 8px 12px; resize: vertical; min-height: 80px; outline: none;
  transition: border-color 0.2s; line-height: 1.65;
}
.manage-append-ta:focus { border-color: var(--accent); }
.manage-append-ta::placeholder { color: var(--muted); }

.manage-divider {
  border: none; border-top: 1px solid var(--border);
  margin: 18px 0 14px;
}

/* Customer selector */
.cust-sel-modal {
  background: var(--bg); border: 1.5px solid var(--blue);
  width: 90%; max-width: 340px; max-height: 70vh;
  display: flex; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15);
}
.cust-sel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--surface); }
.cust-sel-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--blue); margin-bottom: 8px; }
.cust-sel-search {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text); font-family: var(--mono); font-size: 12px;
  padding: 6px 10px; outline: none; transition: border-color 0.2s;
}
.cust-sel-search:focus { border-color: var(--blue); }
.cust-sel-search::placeholder { color: var(--muted); }
.cust-sel-body { flex: 1; overflow-y: auto; }
.cust-sel-item {
  padding: 10px 18px; font-family: var(--mono); font-size: 12px;
  color: var(--text); cursor: pointer; display: flex;
  justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--surface2); transition: background 0.1s;
}
.cust-sel-item:hover { background: var(--blue-dim); color: var(--blue); }
.cust-sel-item .si-count { font-size: 10px; color: var(--muted); }
.cust-sel-footer {
  padding: 10px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end;
  background: var(--surface); flex-shrink: 0;
}

/* Mobile */
@media(max-width:640px) {
  body { padding: 12px 10px 80px; }
  .header { margin-bottom: 14px; }
  textarea.main-ta { min-height: 140px; }
  .btn-match { width: 100%; justify-content: center; }
  .qbtn { padding: 9px 14px; font-size: 11px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <h1>单据号码 <em>匹配工具</em> <span style="font-size:11px;color:var(--muted);font-weight:400">v2</span></h1>
      <p class="desc">A 组按顾客管理 · B 组按月份管理 · 本机永久保存</p>
    </div>
    <div>
      <div class="quick-bar">
        <button class="qbtn qbtn-paste" onclick="quickPaste()">⬆ 粘贴</button>
        <button class="qbtn qbtn-add" onclick="quickAdd()">＋ 添加</button>
        <button class="qbtn qbtn-clear" onclick="confirmClearAll()">✕ 清空</button>
      </div>
      <div class="paste-preview" id="pastePreview">
        <span id="pastePreviewText"></span>
      </div>
    </div>
  </div>

  <!-- MAIN: A input + Match button -->
  <div class="panel-a">
    <div class="panel-header">
      <span class="panel-label">A 组 — 单据来源</span>
      <div class="cust-drop-wrap" id="custDropWrap">
        <button class="hbtn green" onclick="toggleCustDrop()">顾客 ▾</button>
        <div class="cust-drop-panel" id="custDropPanel">
          <div class="drop-search-row">
            <input type="text" id="dropSearchInput" placeholder="搜索顾客…" oninput="renderCustDrop()" onclick="event.stopPropagation()">
          </div>
          <div id="dropList"></div>
        </div>
      </div>
      <span class="cust-loaded-label" id="loadedCustLabel"></span>
      <input type="file" id="fileA" accept=".txt,text/plain" onchange="loadFile('A')">
      <button class="hbtn blue" onclick="document.getElementById('fileA').click()">📂 文件</button>
      <button class="hbtn" onclick="clearPanelA()">✕</button>
    </div>
    <textarea class="main-ta" id="inputA" placeholder="两种输入方式：

【完整单据】贴入 WhatsApp 单据原文，自动提取号码和日期：
26.03.02 1659
(34789)
1 B IBOX
33.33
...

【手动号码】直接输入5位号码，每行一个：
34789
35162

或点击上方「顾客 ▾」载入已保存的顾客资料"></textarea>
    <div class="counter" id="counterA">—</div>
  </div>

  <div class="action-bar">
    <button class="btn btn-match" onclick="runMatch()">▶ 开始匹配</button>
    <button class="btn btn-export" id="btnExport" onclick="exportExcel()" disabled>⬇ 导出 Excel</button>
    <button class="btn btn-sm" onclick="clearPanelA()">✕ 清空 A</button>
    <div class="stat-row" id="statRow" style="display:none">
      <span class="s-total">B库 <em id="sTotal">0</em> 条</span>
      <span class="s-match">匹配 <em id="sMatch">0</em></span>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="results-wrap" id="resultsWrap">
    <div class="section-title">匹配结果</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>日期</th><th>单据号</th><th>B 组单据行</th>
            <th>投注类型</th><th style="text-align:right">金额 (MYR)</th>
          </tr>
        </thead>

<script>
// ════════════════════════════════════════
// A 组 STORAGE  (raw text per customer)
// ════════════════════════════════════════
const A_CUSTOMERS_KEY = 'adb_customers';
const A_RAW_PFX  = 'adb_raw_';
const A_DATA_PFX = 'adb_data_';  // legacy — migration only

function getCustomers() {
  try { return JSON.parse(localStorage.getItem(A_CUSTOMERS_KEY)) || []; }
  catch { return []; }
}
function saveCustomers(arr) { localStorage.setItem(A_CUSTOMERS_KEY, JSON.stringify(arr)); }

function getCustRaw(name) { return localStorage.getItem(A_RAW_PFX + name) || ''; }
function saveCustRaw(name, text) { localStorage.setItem(A_RAW_PFX + name, text); }

function deleteCustData(name) {
  saveCustomers(getCustomers().filter(c => c !== name));
  localStorage.removeItem(A_RAW_PFX + name);
  localStorage.removeItem(A_DATA_PFX + name);
}

function getCustDocCount(name) { return parseA(getCustRaw(name)).map.size; }

// Append raw text; skip only when ALL parsed docNos are duplicates
function addRawToCust(name, newText) {
  const trimmed = newText.trim();
  if (!trimmed) return { added: 0, dupes: 0 };

  const existing = getCustRaw(name);
  const existingDocNos = new Set(parseA(existing).map.keys());
  const { map: newMap } = parseA(trimmed);

  let added = 0, dupes = 0;
  for (const docNo of newMap.keys()) {
    if (existingDocNos.has(docNo)) dupes++;
    else added++;
  }

  if (newMap.size === 0 || added > 0) {
    const combined = existing ? existing.trimEnd() + '\n\n' + trimmed : trimmed;
    saveCustRaw(name, combined);
    return { added: newMap.size === 0 ? 1 : added, dupes };
  }
  return { added: 0, dupes };
}

// Migrate old adb_data_ records → adb_raw_ text
function migrateOldAData() {
  const custs = getCustomers();
  let migrated = 0;
  for (const name of custs) {
    if (localStorage.getItem(A_RAW_PFX + name) !== null) continue;
    const oldJson = localStorage.getItem(A_DATA_PFX + name);
    if (!oldJson) continue;
    try {
      const recs = JSON.parse(oldJson) || [];
      if (!recs.length) continue;
      const noDate = recs.filter(r => !r.date).map(r => r.docNo);
      const byDate = {};
      for (const r of recs.filter(r => r.date)) {
        if (!byDate[r.date]) byDate[r.date] = [];
        byDate[r.date].push(r.docNo);
      }
      const lines = [...noDate];
      for (const [d, nos] of Object.entries(byDate).sort()) lines.push(d, ...nos);
      saveCustRaw(name, lines.join('\n'));
      migrated++;
    } catch {}
  }
  if (migrated > 0) showToast(`已迁移 ${migrated} 位顾客的旧格式资料`);
}

// ════════════════════════════════════════
// A 组 UI
// ════════════════════════════════════════
function refreshAUI() {
  const custs = getCustomers();
  const list = document.getElementById('custList');
  let total = 0;

  if (!custs.length) {
    list.innerHTML = '<span class="no-data">（尚无顾客，请在下方新建）</span>';
    document.getElementById('adbTotal').textContent = '0';
    document.getElementById('adbCount').textContent = '0';
    return;
  }

  list.innerHTML = '';
  for (const name of custs) {
    const cnt = getCustDocCount(name);
    total += cnt;

    const tag = document.createElement('span');
    tag.className = 'cust-tag';
    tag.appendChild(document.createTextNode(name + ' '));

    const cntEl = document.createElement('span');
    cntEl.className = 'tag-count';
    cntEl.textContent = cnt + '条';
    tag.appendChild(cntEl);

    const mgBtn = document.createElement('button');
    mgBtn.className = 'tag-btn';
    mgBtn.textContent = '管理';
    mgBtn.onclick = () => openManage(name);
    tag.appendChild(mgBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'tag-btn tag-del';
    delBtn.textContent = '×';
    delBtn.onclick = () => confirmDeleteCust(name);
    tag.appendChild(delBtn);

    list.appendChild(tag);
  }
  document.getElementById('adbTotal').textContent = total;
  document.getElementById('adbCount').textContent = custs.length;
}

function addCustomer() {
  const inp = document.getElementById('newCustName');
  const name = inp.value.trim();
  if (!name) { showToast('请输入顾客名字'); return; }
  const custs = getCustomers();
  if (custs.includes(name)) { showToast(`「${name}」已存在`); return; }
  custs.push(name);
  saveCustomers(custs);
  inp.value = '';
  refreshAUI();
  renderCustDrop();
  showToast(`已新建顾客「${name}」`);
}

// ════════════════════════════════════════
// B 组 STORAGE
// ════════════════════════════════════════
const B_PFX = 'bdb_';

function getAllMonthKeys() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(B_PFX)) keys.push(k);
  }
  return keys.sort();
}
function getMonthData(mk) {
  try { return JSON.parse(localStorage.getItem(mk)) || []; }
  catch { return []; }
}
function saveMonthData(mk, recs) { localStorage.setItem(mk, JSON.stringify(recs)); }
function deleteMonthData(mk) { localStorage.removeItem(mk); }
function getAllBRecs() {
  const all = [];
  for (const k of getAllMonthKeys()) all.push(...getMonthData(k));
  return all;
}
function monthKeyFromDate(dateStr) {
  if (!dateStr) return null;
  const m = dateStr.match(/^(\d{4}-\d{2})/);
  return m ? B_PFX + m[1] : null;
}
function monthLabel(mk) {
  const [y, mo] = mk.replace(B_PFX, '').split('-');
  return `${y}年${parseInt(mo)}月`;
}

// ════════════════════════════════════════
// B 组 UI
// ════════════════════════════════════════
function refreshBUI() {
  const keys = getAllMonthKeys();
  const list = document.getElementById('monthList');
  const preview = document.getElementById('dbPreview');
  let total = 0;

  if (!keys.length) {
    list.innerHTML = '<span class="no-data">（资料库是空的）</span>';
    preview.textContent = '资料库为空';
    document.getElementById('dbTotal').textContent = '0';
    document.getElementById('dbMonths').textContent = '0';
    return;
  }

  list.innerHTML = '';
  const lines = [];
  for (const k of keys) {
    const recs = getMonthData(k);
    total += recs.length;

    const tag = document.createElement('span');
    tag.className = 'month-tag';
    const em = document.createElement('em');
    em.textContent = `${recs.length}条`;
    tag.appendChild(document.createTextNode(monthLabel(k) + ' '));
    tag.appendChild(em);
    const delBtn = document.createElement('button');
    delBtn.className = 'del-month';
    delBtn.textContent = '×';
    delBtn.onclick = () => confirmDeleteMonth(k);
    tag.appendChild(delBtn);
    list.appendChild(tag);
    lines.push(`▸ ${monthLabel(k)}：${recs.length} 条`);
  }

  preview.innerHTML = lines.map(l => `<div>${esc(l)}</div>`).join('');
  document.getElementById('dbTotal').textContent = total;
  document.getElementById('dbMonths').textContent = keys.length;
}

// ════════════════════════════════════════
// ADD TO B DATABASE
// ════════════════════════════════════════
function addToDatabase() {
  const text = document.getElementById('inputBAdd').value.trim();
  if (!text) { showToast('请先输入或载入 B 组资料'); return; }

  const records = parseB(text);
  if (!records.length) { showToast('未识别到任何单据记录，请检查格式'); return; }

  const groups = {};
  let noDate = 0;
  for (const rec of records) {
    const mk = monthKeyFromDate(rec.dateB);
    if (!mk) { noDate++; continue; }
    if (!groups[mk]) groups[mk] = [];
    groups[mk].push(rec);
  }

  let added = 0, skipped = 0;
  for (const [mk, recs] of Object.entries(groups)) {
    const existing = getMonthData(mk);
    const exSet = new Set(existing.map(r => r.docNo + '|' + r.line + '|' + r.betType));
    const newOnes = recs.filter(r => !exSet.has(r.docNo + '|' + r.line + '|' + r.betType));
    skipped += recs.length - newOnes.length;
    added += newOnes.length;
    if (newOnes.length) saveMonthData(mk, [...existing, ...newOnes]);
  }

  document.getElementById('inputBAdd').value = '';
  refreshBUI();

  if (bSync && added > 0) {
    const syncPayload = {};
    for (const mk of Object.keys(groups)) {
      const d = getMonthData(mk);
      if (d.length) syncPayload[mk] = d;
    }
    bSync.postMessage({ type: 'syncNew', data: syncPayload });
  }

  let msg = `已添加 ${added} 条`;
  if (skipped) msg += `，已重复 ${skipped} 条跳过`;
  if (noDate) msg += `，${noDate} 条无法识别日期`;
  showToast(msg);
}

// ════════════════════════════════════════
// PARSERS
// ════════════════════════════════════════
function parseA(text) {
  if (!text || !text.trim()) return { mode: 'manual', map: new Map() };
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const hasReceiptDate = lines.some(l =>
    /\d{2}\.\d{2}\.\d{2}\s+\d{3,4}/.test(l) || /^\d{6}\s+\d{4}/.test(l));
  const hasIsoDate     = lines.some(l => /^\d{4}-\d{2}-\d{2}$/.test(l));
  const map = new Map();

  if (!hasReceiptDate && !hasIsoDate) {
    for (const line of lines)
      for (const m of line.matchAll(/(?<!\d)(\d{5})(?!\d)/g))
        if (!map.has(m[1])) map.set(m[1], '');
    return { mode: 'manual', map };
  }

  let currentDate = '';
  for (const line of lines) {
    let m = line.match(/^(\d{4}-\d{2}-\d{2})$/);
    if (m) { currentDate = m[1]; continue; }

    // Dot format: 26.09.01 1520  or  26.09.02 1414 (96315)
    m = line.match(/(\d{2})\.(\d{2})\.(\d{2})\s+\d{3,4}/);
    if (m) currentDate = `20${m[1]}-${m[2]}-${m[3]}`;

    // No-dot format: 260920 1324 (7)
    m = line.match(/^(\d{2})(\d{2})(\d{2})\s+\d{4}/);
    if (m) currentDate = `20${m[1]}-${m[2]}-${m[3]}`;

    // Scan every line for doc numbers — mirrors old system (no continue above)
    for (const dm of line.matchAll(/\((\d{1,6})\)/g))
      if (!map.has(dm[1])) map.set(dm[1], currentDate || '(日期未识别)');

    if (hasIsoDate) {
      m = line.match(/^(\d{5})$/);
      if (m && !map.has(m[1])) map.set(m[1], currentDate || '');
    }
  }
  return { mode: hasIsoDate ? 'stored' : 'receipt', map };
}

function parseB(text) {
  const records = [];
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let currentDateB = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const dm = line.match(/^\((\d{4}-\d{2}-\d{2})\)$/);
    if (dm) { currentDateB = dm[1]; i++; continue; }

    const m = line.match(/\((\d{5})\)/);
    if (m) {
      const docNo = m[1];
      let betType = '';
      if (i + 1 < lines.length) {
        const next = lines[i + 1];
        if (!/\(\d{5}\)/.test(next) && !/^\d+\.\d{2}$/.test(next.replace(/,/g, ''))) {
          betType = next; i++;
        }
      }
      let amount = '';
      if (i + 1 < lines.length) {
        const next = lines[i + 1];
        if (/^\d+\.\d{2}$/.test(next.replace(/,/g, ''))) {
          amount = next.replace(/,/g, ''); i++;
        }
      }
      records.push({ docNo, line, betType, amount, dateB: currentDateB });
    }
    i++;
  }
  return records;
}

function toggleCustDrop() {
  const panel = document.getElementById('custDropPanel');
  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
  } else {
    renderCustDrop();
    panel.classList.add('show');
    setTimeout(() => document.getElementById('dropSearchInput').focus(), 50);
  }
}

function renderCustDrop() {
  const q = document.getElementById('dropSearchInput').value.trim().toLowerCase();
  const custs = getCustomers().filter(c => !q || c.toLowerCase().includes(q));
  const list = document.getElementById('dropList');
  list.innerHTML = '';
  if (!custs.length) {
    const el = document.createElement('div');
    el.className = 'drop-empty';
    el.textContent = q ? '无匹配顾客' : '尚无顾客';
    list.appendChild(el);
    return;
  }
  for (const name of custs) {
    const div = document.createElement('div');
    div.className = 'drop-item';
    div.appendChild(document.createTextNode(name));
    const cntEl = document.createElement('span');
    cntEl.className = 'di-count';
    cntEl.textContent = getCustDocCount(name) + '条';
    div.appendChild(cntEl);
    div.onclick = () => loadCustToA(name);
    list.appendChild(div);
  }
}

function loadCustToA(name) {
  document.getElementById('inputA').value = getCustRaw(name);
  document.getElementById('loadedCustLabel').textContent = `▸ ${name}`;
  document.getElementById('custDropPanel').classList.remove('show');
  document.getElementById('dropSearchInput').value = '';
  updateCounterA();
  showToast(`已载入「${name}」（${getCustDocCount(name)} 个号码）`);
}

document.addEventListener('click', e => {

  if (!wrap.contains(e.target)) document.getElementById('custDropPanel').classList.remove('show');

  showToast('已保存');
}

function confirmClearCust() {
  showConfirm(
    `清空「${activeCust}」`,
    `确定要清空「${activeCust}」的全部资料吗？\n顾客名字保留，资料无法复原。`,
    () => {
      saveCustRaw(activeCust, '');
      closeDialog();
      refreshManageModal();
      refreshAUI();
      renderCustDrop();
      showToast(`已清空「${activeCust}」的资料`);
    }
  );
}

function manageAdd() {
  const text = document.getElementById('manageAddInput').value.trim();
  if (!text) { showToast('请先输入资料'); return; }
  const { added, dupes } = addRawToCust(activeCust, text);
  document.getElementById('manageAddInput').value = '';
  refreshManageModal();
  refreshAUI();
  renderCustDrop();
  if (dupes > 0 && added === 0) showToast(`已重复：全部 ${dupes} 条已存在，未添加`, 'warn');
  else if (dupes > 0) showToast(`已追加（${dupes} 条重复跳过）`);
  else showToast('已追加资料');
}

// ════════════════════════════════════════
// QUICK PASTE + ADD
// ════════════════════════════════════════
let pastedText = '';

async function quickPaste() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text.trim()) { showToast('剪贴板是空的'); return; }
    pastedText = text;
    document.getElementById('pastePreviewText').textContent = text.slice(0, 150) + (text.length > 150 ? '…' : '');
    document.getElementById('pastePreview').classList.add('show');
    showToast('已读取剪贴板，按「添加」选择顾客');
  } catch {
    showToast('无法读取剪贴板，请在浏览器允许权限', 'warn');
  }
}

function quickAdd() {
  if (!pastedText.trim()) { showToast('请先按「粘贴」读取剪贴板内容'); return; }
  if (!getCustomers().length) { showToast('请先新建顾客'); return; }
  document.getElementById('custSelSearch').value = '';
  renderCustSelList();
  document.getElementById('custSelOverlay').classList.add('show');
  setTimeout(() => document.getElementById('custSelSearch').focus(), 50);
}

function renderCustSelList() {
  const q = document.getElementById('custSelSearch').value.trim().toLowerCase();
  const custs = getCustomers().filter(c => !q || c.toLowerCase().includes(q));
  const list = document.getElementById('custSelList');
  list.innerHTML = '';
  if (!custs.length) {
    const div = document.createElement('div');
    div.style.cssText = 'padding:14px 18px;font-family:var(--mono);font-size:11px;color:var(--muted);font-style:italic';
    div.textContent = '无匹配顾客';
    list.appendChild(div);
    return;
  }
  for (const name of custs) {
    const div = document.createElement('div');
    div.className = 'cust-sel-item';
    div.appendChild(document.createTextNode(name));
    const cntEl = document.createElement('span');
    cntEl.className = 'si-count';
    cntEl.textContent = getCustDocCount(name) + '条';
    div.appendChild(cntEl);
    div.onclick = () => addPastedToCust(name);
    list.appendChild(div);
  }
}

function addPastedToCust(name) {
  const { added, dupes } = addRawToCust(name, pastedText);
  closeCustSel();
  document.getElementById('pastePreview').classList.remove('show');
  pastedText = '';
  refreshAUI();
  renderCustDrop();
  if (dupes > 0 && added === 0) showToast(`已重复：全部单据已存在于「${name}」`, 'warn');
  else if (dupes > 0) showToast(`已添加到「${name}」（${dupes} 条重复跳过）`);
  else showToast(`已添加到「${name}」`);
}

function closeCustSel() {
  document.getElementById('custSelOverlay').classList.remove('show');
}
document.getElementById('custSelOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeCustSel(); });

// ════════════════════════════════════════
// MATCH
// ════════════════════════════════════════
let matchedRows = [];

function runMatch() {
  const textA = document.getElementById('inputA').value.trim();
  if (!textA) { showToast('请先输入 A 组单据或号码'); return; }
  const allB = getAllBRecs();
  if (!allB.length) { showToast('B 组资料库是空的，请先添加资料'); return; }

  const { map: aMap } = parseA(textA);
  if (!aMap.size) { showToast('A 组未识别到任何单据号码'); return; }
  matchedRows = [];

  for (const rec of allB) {
    if (aMap.has(rec.docNo)) {
      const dA = aMap.get(rec.docNo);
      matchedRows.push({ dateA: dA || rec.dateB || '(日期未识别)', ...rec });
    }
  }

  renderTable(matchedRows);
  document.getElementById('sTotal').textContent = allB.length;
  document.getElementById('sMatch').textContent = matchedRows.length;
  document.getElementById('statRow').style.display = 'flex';
  document.getElementById('btnExport').disabled = matchedRows.length === 0;
  document.getElementById('resultsWrap').classList.add('show');
  document.getElementById('resultsWrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  showToast(matchedRows.length ? `匹配到 ${matchedRows.length} 条记录` : '没有匹配结果');
}

function renderTable(rows) {
  const tbody = document.getElementById('resultBody');
  tbody.innerHTML = '';
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:32px;color:var(--muted);font-family:var(--mono)">无匹配结果</td></tr>`;
    return;
  }
  for (const r of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="td-date">${esc(r.dateA)}</td>
      <td class="td-docno">${esc(r.docNo)}</td>
      <td>${esc(r.line)}</td>
      <td style="color:var(--muted)">${esc(r.betType)}</td>
      <td class="td-amt">${r.amount || '—'}</td>`;
    tbody.appendChild(tr);
  }
}

// ════════════════════════════════════════
// EXPORT EXCEL
// ════════════════════════════════════════
function exportExcel() {
  if (!matchedRows.length) return;
  const wb = XLSX.utils.book_new();
  const data = [['日期', '单据号码', 'B组单据行', '投注类型', '金额 (MYR)']];
  for (const r of matchedRows)
    data.push([r.dateA, r.docNo, r.line, r.betType, r.amount ? parseFloat(r.amount) : '']);
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{ wch: 14 }, { wch: 10 }, { wch: 28 }, { wch: 18 }, { wch: 12 }];
  XLSX.utils.book_append_sheet(wb, ws, '匹配结果');
  XLSX.writeFile(wb, `单据匹配_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Excel 已导出');
}

// ════════════════════════════════════════
// FILE LOADERS
// ════════════════════════════════════════
function loadFile(side) {
  const inp = document.getElementById('file' + side);
  const file = inp.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('input' + side).value = e.target.result;
    if (side === 'A') { document.getElementById('loadedCustLabel').textContent = ''; updateCounterA(); }
    showToast(`已载入：${file.name}`);
    inp.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function loadFileToAdd(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('inputBAdd').value = e.target.result;
    showToast(`已载入：${file.name}，请按「添加到资料库」`);
  };
  reader.readAsText(file, 'UTF-8');
}

// ════════════════════════════════════════
// B JSON IMPORT / EXPORT
// ════════════════════════════════════════
function exportBJSON() {
  const data = {};
  for (const k of getAllMonthKeys()) data[k] = getMonthData(k);
  if (!Object.keys(data).length) { showToast('B 组资料库是空的'); return; }
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `b-data-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('B 组资料已导出为 JSON');
}

function handleBImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      let total = 0;
      for (const [mk, recs] of Object.entries(data)) {
        if (!mk.startsWith(B_PFX)) continue;
        const ex = getMonthData(mk);
        const exSet = new Set(ex.map(r => r.docNo + '|' + r.line + '|' + r.betType));
        const newOnes = recs.filter(r => !exSet.has(r.docNo + '|' + r.line + '|' + r.betType));
        if (newOnes.length) { saveMonthData(mk, [...ex, ...newOnes]); total += newOnes.length; }
      }
      refreshBUI();
      showToast(total > 0 ? `已导入 ${total} 条 B 组记录` : '无新记录（全部已存在）');
    } catch { showToast('JSON 格式错误，导入失败', 'warn'); }
  };
  reader.readAsText(file, 'UTF-8');
}

// ════════════════════════════════════════
// DATE CHECK
// ════════════════════════════════════════
function toggleDateCheck() {
  const panel = document.getElementById('dateCheckPanel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }

  const allRecs = getAllBRecs();
  if (!allRecs.length) { showToast('B 组资料库是空的'); return; }

  const dateSet = new Set();
  for (const r of allRecs) if (r.dateB) dateSet.add(r.dateB);

  const byMonth = {};
  for (const d of [...dateSet].sort()) {
    const mo = d.slice(0, 7);
    if (!byMonth[mo]) byMonth[mo] = [];
    byMonth[mo].push(d);
  }

  let html = '';
  for (const [mo, dates] of Object.entries(byMonth).sort()) {
    const [yr, mn] = mo.split('-');
    const label = `${yr}年${parseInt(mn)}月`;
    const days = new Date(parseInt(yr), parseInt(mn), 0).getDate();
    const missing = [];
    for (let d = 1; d <= days; d++) {
      const ds = `${yr}-${mn}-${String(d).padStart(2,'0')}`;
      if (!dateSet.has(ds)) missing.push(d);
    }
    html += `<div style="margin-bottom:12px">
      <div style="color:var(--blue);font-weight:600;font-family:var(--mono);font-size:12px;margin-bottom:4px">${label}</div>
      <div style="color:var(--accent);font-family:var(--mono);font-size:12px">✓ 已有：${dates.map(d => d.slice(8).replace(/^0/,'')).join('、')} 日</div>
      ${missing.length
        ? `<div style="color:var(--warn);font-family:var(--mono);font-size:12px;margin-top:2px">⚠ 缺少：${missing.join('、')} 日</div>`
        : `<div style="color:var(--muted);font-family:var(--mono);font-size:12px;margin-top:2px">本月日期完整</div>`}
    </div>`;
  }

  document.getElementById('dateCheckContent').innerHTML = html;
  panel.style.display = 'block';
}

// ════════════════════════════════════════
// MISC
// ════════════════════════════════════════
document.getElementById('inputA').addEventListener('input', updateCounterA);

function updateCounterA() {
  const txt = document.getElementById('inputA').value.trim();
  const el = document.getElementById('counterA');
  if (!txt) { el.innerHTML = '—'; return; }
  const { mode, map } = parseA(txt);
  const label = { manual: '手动号码', receipt: '单据', stored: '顾客存档' }[mode] || mode;
  el.innerHTML = `识别到 <em>${map.size}</em> 个号码（${label}模式）`;
}

function clearPanelA() {
  document.getElementById('inputA').value = '';
  document.getElementById('counterA').innerHTML = '—';
  document.getElementById('loadedCustLabel').textContent = '';
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type ? ' ' + type : '');
  void el.offsetWidth;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3500);
}

// ════════════════════════════════════════
// B 组 BroadcastChannel 同步
// ════════════════════════════════════════
const bSync = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('danJuBSync') : null;

if (bSync) {
  bSync.onmessage = function(e) {
    const { type, data } = e.data;
    if (type === 'hello') {
      const payload = {};
      for (const k of getAllMonthKeys()) payload[k] = getMonthData(k);
      bSync.postMessage({ type: 'syncAll', data: payload });
      return;
    }
    if (type === 'syncAll' || type === 'syncNew') {
      let merged = 0;
      for (const [mk, recs] of Object.entries(data)) {
        if (!mk.startsWith(B_PFX)) continue;
        const ex = getMonthData(mk);
        const exSet = new Set(ex.map(r => r.docNo + '|' + r.line + '|' + r.betType));
        const toAdd = recs.filter(r => !exSet.has(r.docNo + '|' + r.line + '|' + r.betType));
        if (toAdd.length) { saveMonthData(mk, [...ex, ...toAdd]); merged += toAdd.length; }
      }
      if (merged > 0) { refreshBUI(); showToast(`已同步 B 组 ${merged} 条新记录`); }
    }
  };
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { refreshAUI(); refreshBUI(); }
});

// Init
migrateOldAData();
initSections();
refreshAUI();
refreshBUI();
if (bSync) bSync.postMessage({ type: 'hello' });
</script>
